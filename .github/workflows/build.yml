name: Build

on:
  push:
    branches: [master]
    tags: ['R*', 'v*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release and attach binaries'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - arch: linux_x86_64
            runs-on: ubuntu-latest
            container: 'ubuntu:22.04'
          - arch: linux_aarch64
            runs-on: ubuntu-24.04-arm
            container: 'ubuntu:22.04'
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Install minimal bootstrap tools
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
          $SUDO apt-get update
          DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
          DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y --no-install-recommends \
            build-essential cmake nasm pkg-config ca-certificates curl git \
            libvulkan-dev libxxhash-dev zlib1g-dev

      - name: Setup Python 3.12 and build tools
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv venv --python 3.12 "$HOME/build-venv"
          uv pip install --python "$HOME/build-venv" meson ninja "vapoursynth>=80a1"
          echo "$HOME/build-venv/bin" >> "$GITHUB_PATH"

      - name: Build and install Vulkan-Headers
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
          git clone https://github.com/KhronosGroup/Vulkan-Headers.git --depth 1
          cmake -S Vulkan-Headers -B Vulkan-Headers/build -DCMAKE_INSTALL_PREFIX=/usr
          $SUDO cmake --install Vulkan-Headers/build
          rm -rf Vulkan-Headers

      - name: Build and install glslang
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
          git clone https://github.com/KhronosGroup/glslang.git --depth 1
          cmake -S glslang -B glslang/build -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build glslang/build -j$(nproc)
          $SUDO cmake --install glslang/build
          rm -rf glslang

      - name: Build and install dav1d (static)
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
          git clone https://github.com/videolan/dav1d.git --depth 1
          cd dav1d
          meson setup build -Dprefix=/usr --default-library=static -Denable_tools=false -Denable_tests=false -Db_lto=true
          meson compile -C build
          $SUDO env "PATH=$PATH" "$HOME/build-venv/bin/meson" install -C build
          cd ..
          rm -rf dav1d

      - name: Build and install Little-CMS (static)
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
          git clone https://github.com/mm2/Little-CMS.git --depth 1
          cd Little-CMS
          meson setup build -Dprefix=/usr --default-library=static -Dtests=disabled -Db_lto=true
          meson compile -C build
          $SUDO env "PATH=$PATH" "$HOME/build-venv/bin/meson" install -C build
          cd ..
          rm -rf Little-CMS

      - name: Build and install FFmpeg (static master)
        run: |
          if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi
          export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/lib/$(uname -m)-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH"
          git clone https://github.com/FFmpeg/FFmpeg.git --depth 1
          cd FFmpeg
          ./configure \
            --prefix=/usr \
            --enable-gpl \
            --enable-version3 \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-swresample \
            --disable-swscale \
            --disable-avfilter \
            --disable-encoders \
            --disable-muxers \
            --disable-bzlib \
            --disable-lzma \
            --disable-xlib \
            --enable-lcms2 \
            --enable-libdav1d \
            --enable-vulkan \
            --enable-pic \
            --enable-static \
            --disable-shared \
            --disable-debug
          make -j$(nproc)
          $SUDO make install -j$(nproc)
          cd ..
          rm -rf FFmpeg

      - name: Build BestSource
        run: |
          export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/lib/$(uname -m)-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build \
            --buildtype=release \
            -Db_ndebug=if-release \
            -Db_lto=true \
            -Denable_plugin=true \
            -Denable_gpu=enabled \
            -Denable_avisynth=true \
            -Dprefer_static=true \
            -Dcpp_link_args="-static-libstdc++ -static-libgcc"
          meson compile -C build
          strip --strip-unneeded build/libbestsource.so

      - name: Prepare standalone binary
        run: |
          mkdir -p output
          cp build/libbestsource.so "output/libbestsource-${{ matrix.arch }}.so"
          cp build/libbestsource.so output/libbestsource.so

      - uses: actions/upload-artifact@v7
        with:
          name: bestsource-${{ matrix.arch }}
          path: output/*

  release:
    needs: [build-linux]
    if: ${{ startsWith(github.ref, 'refs/tags/R') || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "libbestsource-linux_x86_64.so" -exec cp {} release-assets/libbestsource-linux-x86_64.so \;
          find artifacts -name "libbestsource-linux_aarch64.so" -exec cp {} release-assets/libbestsource-linux-aarch64.so \;
          ls -lh release-assets/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ startsWith(github.ref, 'refs/tags/') }}" != "true" ]; then
            tag="v$(date +'%Y%m%d')-${GITHUB_SHA:0:7}"
          fi
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" release-assets/* --clobber
